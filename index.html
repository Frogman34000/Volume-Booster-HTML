<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Booster</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle at top,#2c2c54,#0f0f1a);
  color:white;
  height:100vh;
  overflow:hidden;
}

.github{
  position:absolute;
  top:15px;
  right:15px;
  width:42px;
  height:42px;
  background:#24292e;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  text-decoration:none;
  font-size:20px;
}

.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:75vh;
}

.card{
  width:360px;
  background:rgba(47,47,79,.9);
  padding:24px;
  border-radius:18px;
  text-align:center;
}

.subtitle{
  font-size:12px;
  opacity:.7;
  margin-bottom:8px;
}

.drop-zone{
  border:2px dashed #888;
  padding:16px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
}

#statusText{
  font-size:12px;
  opacity:0.85;
  margin-top:6px;
  min-height:16px;
}

label{
  display:block;
  margin-top:10px;
  font-size:14px;
}

input[type=range]{
  width:100%;
}

#boostValue{
  font-size:14px;
  margin-top:6px;
  opacity:.8;
}

.dock{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(20,20,35,.95);
  padding:12px;
}

.timeRow{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
}

.bar{
  flex:1;
  height:7px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  cursor:pointer;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7f8cff,#5a67d8);
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

button{
  background:#5a67d8;
  border:none;
  padding:9px 12px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}
button:hover{
  background:#7f8cff;
}
</style>
</head>

<body>

<a class="github" href="https://github.com/Frogman34000/Volume-Booster-HTML" target="_blank">
<i class="fa-brands fa-github"></i>
</a>

<div class="center">
  <div class="card">

    <h2><i class="fa-solid fa-volume-high"></i> Audio Booster</h2>
    <div class="subtitle">Made by Frogman34000 v1.1</div>

    <div class="drop-zone" id="dropZone">
      <i class="fa-solid fa-upload"></i> Upload / Drop Audio
    </div>

    <div id="statusText">No file loaded</div>

    <input type="file" id="fileInput" accept="audio/*" hidden>

    <label>Boost</label>
    <input type="range" id="boost" min="1" max="10" step="0.1" value="1">
    <div id="boostValue">1.0x</div>

  </div>
</div>

<div class="dock">

  <div class="timeRow">
    <span id="currentTime">0:00</span>

    <div class="bar" id="seekBar">
      <div class="fill" id="fill"></div>
    </div>

    <span id="duration">0:00</span>
  </div>

  <div class="controls">
    <button id="back"><i class="fa-solid fa-backward-step"></i></button>
    <button id="play"><i class="fa-solid fa-play"></i></button>
    <button id="forward"><i class="fa-solid fa-forward-step"></i></button>
    <button id="download"><i class="fa-solid fa-download"></i></button>
  </div>

</div>

<audio id="audio"></audio>

<script>
const audio = document.getElementById("audio");
const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");

const playBtn = document.getElementById("play");
const backBtn = document.getElementById("back");
const forwardBtn = document.getElementById("forward");
const downloadBtn = document.getElementById("download");

const seekBar = document.getElementById("seekBar");
const fill = document.getElementById("fill");

const boost = document.getElementById("boost");
const boostValue = document.getElementById("boostValue");

const statusText = document.getElementById("statusText");

const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

let fileURL = "";
let fileName = "audio.wav";

const ctx = new (window.AudioContext || window.webkitAudioContext)();
const gain = ctx.createGain();
gain.gain.value = 1;
gain.connect(ctx.destination);

let source;
let connected = false;

function connectAudio(){
  if(connected) return;
  source = ctx.createMediaElementSource(audio);
  source.connect(gain);
  connected = true;
}

function format(t){
  if(!t || isNaN(t)) return "0:00";
  return `${Math.floor(t/60)}:${Math.floor(t%60).toString().padStart(2,"0")}`;
}

/* LOAD */
function load(file){
  if(!file) return;

  if(!file.type.startsWith("audio/")){
    statusText.textContent = "❌ Invalid file";
    return;
  }

  fileURL = URL.createObjectURL(file);
  fileName = file.name;

  audio.src = fileURL;
  audio.load();

  connectAudio();

  statusText.textContent = "✅ Loaded: " + file.name;
}

/* PLAY */
playBtn.onclick = async () => {
  await ctx.resume();

  if(audio.paused){
    await audio.play();
    playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
  } else {
    audio.pause();
    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
  }
};

audio.onended = () => {
  playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
};

/* SKIP */
backBtn.onclick = () => audio.currentTime -= 10;
forwardBtn.onclick = () => audio.currentTime += 10;

/* BOOST */
boost.oninput = async () => {
  await ctx.resume();

  const val = Number(boost.value);
  gain.gain.setValueAtTime(val, ctx.currentTime);

  boostValue.textContent = val.toFixed(1) + "x";
  statusText.textContent = "🔊 Boost: " + val.toFixed(1) + "x";
};

/* TIME */
audio.ontimeupdate = () => {
  currentTimeEl.textContent = format(audio.currentTime);

  if(audio.duration){
    fill.style.width = (audio.currentTime / audio.duration) * 100 + "%";
  }
};

audio.onloadedmetadata = () => {
  durationEl.textContent = format(audio.duration);
};

/* SEEK */
seekBar.onclick = (e) => {
  const rect = seekBar.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
};

/* EXPORT BOOSTED AUDIO (REAL) */
async function exportBoostedAudio(){
  if(!fileURL){
    statusText.textContent = "⚠️ No file loaded";
    return;
  }

  statusText.textContent = "⏳ Rendering boosted audio...";

  const response = await fetch(fileURL);
  const arrayBuffer = await response.arrayBuffer();

  const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

  const offline = new OfflineAudioContext(
    audioBuffer.numberOfChannels,
    audioBuffer.length,
    audioBuffer.sampleRate
  );

  const source = offline.createBufferSource();
  source.buffer = audioBuffer;

  const gainNode = offline.createGain();
  gainNode.gain.value = Number(boost.value);

  source.connect(gainNode);
  gainNode.connect(offline.destination);

  source.start();

  const rendered = await offline.startRendering();

  const wav = bufferToWav(rendered);
  const url = URL.createObjectURL(wav);

  const a = document.createElement("a");
  a.href = url;
  a.download = "boosted_" + fileName;
  a.click();

  statusText.textContent = "✅ Boosted audio downloaded!";
}

/* WAV ENCODER */
function bufferToWav(buffer){
  const length = buffer.length * buffer.numberOfChannels * 2 + 44;
  const arrayBuffer = new ArrayBuffer(length);
  const view = new DataView(arrayBuffer);

  let offset = 0;

  const writeStr = s => { for(let i=0;i<s.length;i++) view.setUint8(offset++, s.charCodeAt(i)); };
  const write16 = v => { view.setUint16(offset, v, true); offset+=2; };
  const write32 = v => { view.setUint32(offset, v, true); offset+=4; };

  writeStr("RIFF");
  write32(length-8);
  writeStr("WAVE");

  writeStr("fmt ");
  write32(16);
  write16(1);
  write16(buffer.numberOfChannels);
  write32(buffer.sampleRate);
  write32(buffer.sampleRate*buffer.numberOfChannels*2);
  write16(buffer.numberOfChannels*2);
  write16(16);

  writeStr("data");
  write32(length-offset-4);

  const channels = [];
  for(let i=0;i<buffer.numberOfChannels;i++){
    channels.push(buffer.getChannelData(i));
  }

  let i=0;
  while(i<buffer.length){
    for(let c=0;c<buffer.numberOfChannels;c++){
      let sample = Math.max(-1, Math.min(1, channels[c][i]));
      sample = sample < 0 ? sample*0x8000 : sample*0x7fff;
      view.setInt16(offset, sample, true);
      offset+=2;
    }
    i++;
  }

  return new Blob([arrayBuffer], {type:"audio/wav"});
}

/* DOWNLOAD BUTTON */
downloadBtn.onclick = exportBoostedAudio;

/* UPLOAD */
dropZone.onclick = () => fileInput.click();
fileInput.onchange = e => load(e.target.files[0]);

dropZone.ondragover = e => e.preventDefault();
dropZone.ondrop = e => {
  e.preventDefault();
  load(e.dataTransfer.files[0]);
};
</script>

</body>
</html>
